name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: go test ./...

      - name: Build
        run: scripts/build.sh "${GITHUB_REF_NAME}"

      # A tag with a dash (v0.2.0-rc.1) is a pre-release.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* install.sh "${flags[@]}" --title "commy ${GITHUB_REF_NAME#v}" --generate-notes
